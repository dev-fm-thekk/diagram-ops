syntax = "proto3";

package agent;

service AgentService {
  rpc SendMessage (stream SendMessageRequest) returns (stream SendMessageResponse);
  rpc GetSession  (GetSessionRequest)  returns (GetSessionResponse);
  rpc EndSession  (EndSessionRequest)  returns (EndSessionResponse);
}

// ── Requests ──────────────────────────────────────────────

message SendMessageRequest {
  string message    = 1;
  string session_id = 2; // tie messages to a conversation
  Role   role       = 3; // who is sending
}

message GetSessionRequest {
  string session_id = 1;
}

message EndSessionRequest {
  string session_id = 1;
}

// ── Responses ─────────────────────────────────────────────

message SendMessageResponse {
  oneof event {
    TextChunk   text_chunk   = 1; // streaming token/chunk
    ToolCall    tool_call    = 2; // agent invoking a tool
    ToolResult  tool_result  = 3; // result of a tool call
    DoneEvent   done         = 4; // stream finished
    ErrorEvent  error        = 5; // something went wrong
  }
  string session_id = 6;
}

message GetSessionResponse {
  string          session_id = 1;
  repeated Message history   = 2;
  SessionStatus   status     = 3;
}

message EndSessionResponse {
  bool success = 1;
}

message TextChunk {
  string content      = 1;
  int32  chunk_index  = 2;
}

message ToolCall {
  string tool_name    = 1;
  string tool_call_id = 2;
  string input_json   = 3; 
}

message ToolResult {
  string tool_call_id = 1;
  string output_json  = 2;
  bool   is_error     = 3;
}

message DoneEvent {
  string full_response  = 1; 
  int32  input_tokens   = 2;
  int32  output_tokens  = 3;
  string stop_reason    = 4;
}

message ErrorEvent {
  int32  code    = 1;
  string message = 2;
}


message Message {
  string session_id = 1;
  string content    = 2;
  Role   role       = 3;
  int64  timestamp  = 4;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER        = 1;
  ROLE_ASSISTANT   = 2;
  ROLE_TOOL        = 3;
}

enum SessionStatus {
  SESSION_UNSPECIFIED = 0;
  SESSION_ACTIVE      = 1;
  SESSION_ENDED       = 2;
}